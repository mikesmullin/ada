# Ada's user-tunable settings. Edit and restart ada-back to apply
# (systemctl --user restart ada-back). Each of these can still be
# overridden per-run with an env var of the same name (ADA_VOICE, ...)
# for quick one-off testing without touching this file.

# Voice preset name, as defined in /workspace/voice/config.yaml's `voices:`
# map (e.g. ada, nicole, bella, norman, lessac, ...).
voice: nova

# Private brain graph (gitignored; nested git inside). Absolute path to db/.
brain_path: /workspace/ada/db

# Soft cap on recent conversation turns kept for prompt context.
# Token-aware compaction may drop more under context.max_tokens.
history_max: 48

# Gemma-4 ~120K context window (PLAN2 W7).
context:
  max_tokens: 120000
  compact_reserve_tokens: 8000

# Shared task list (M2 — path locked; todo MCP later).
task_lists:
  shared: /workspace/Biz/EM/Agent/ada-shared.task.md

# Deny-by-default tool allowlist (PLAN2 M3). Re-read on every tool call.
allowlist_file: /workspace/ada/allowlist.txt

# Optional per-tool risk overrides (low | medium | high). Defaults live in
# back/lib/tool-gate.coffee. low+allowlisted runs; medium/high need Tom when
# confirm.enabled is true (M4).
# tool_risk:
#   control_browser: high

# Tom / confirm (M4). enabled: false until Tom microagent is wired.
confirm:
  enabled: false
  approve: random_3_word_phrase
  deny_phrases:
    - "belay that order"
  timeout_ms: 60000

# Progress narrator (M5).
progress:
  interval_ms: 8000
  cancel_prefix: "cancel that tool"

# Background planner (M6).
planner:
  volunteer_interval_ms: 3600000

# Diary interval (M7; also scheduled via crony).
diary:
  interval: 4h
